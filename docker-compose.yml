services:
  api:
    build: .
    image: otp-code-extractor-api:local
    container_name: otp-code-extractor-api
    ports:
      - "8000:8000"
    environment:
      OTP_EXTRACTOR_ENVIRONMENT: production
      OTP_EXTRACTOR_LOG_FORMAT: json
      OTP_EXTRACTOR_LOG_LEVEL: INFO
      OTP_EXTRACTOR_RATE_LIMIT_PER_MINUTE: "120"
      OTP_EXTRACTOR_CORS_ORIGINS: '["*"]'
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/livez"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
